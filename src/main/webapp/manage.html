<!DOCTYPE html>
<html>

<head>
    <meta charset="utf-8">
    <title>管理后台</title>
    <meta name="renderer" content="webkit">
    <meta http-equiv="X-UA-Compatible" content="IE=edge,chrome=1">
    <meta name="viewport" content="width=device-width, initial-scale=1">
    <link rel="stylesheet" href="./lib/bootstrap/css/bootstrap.min.css">
    <link rel="stylesheet" href="./lib/layui/css/layui.css">
    <link rel="stylesheet" href="./lib/sweetalert2/sweetalert2.min.css">
    <link rel="stylesheet" href="./css/manage.css">
</head>

<body>
    <div class="layui-layout layui-layout-admin">
        <div class="layui-header">
            <div class="layui-logo layui-hide-xs layui-bg-black">管理后台</div>
            <ul class="layui-nav layui-layout-right">
                <li class="layui-nav-item layui-hide layui-show-sm-inline-block">
                    <a href="javascript:;">
                        <img src="./image/manage/sakiko.jpg" class="layui-nav-img">
                        admin
                    </a>
                    <dl class="layui-nav-child">
                        <dd><a href="login.html">退出登录</a></dd>
                    </dl>
                </li>
            </ul>
        </div>
        <div class="layui-side layui-bg-black">
            <div class="layui-side-scroll">
                <!-- 左侧导航区域（可配合layui已有的垂直导航） -->
                <ul class="layui-nav layui-nav-tree" lay-filter="test" id="sideMenu">
                    <li class="layui-nav-item"><a href="javascript:;" data-type="user">用户管理</a></li>
                    <li class="layui-nav-item"><a href="javascript:;" data-type="todo">Todo管理</a></li>
                </ul>
            </div>
        </div>
        <div class="layui-body" id="mainBody">
            <!-- 内容主体区域 -->
            <div style="padding: 15px;" id="mainContent">
                <blockquote class="layui-elem-quote layui-text">
                    点击左侧开始管理
                </blockquote>
            </div>
        </div>
        <div class="layui-footer" id="navigation">
            <!-- 底部固定区域 -->
        </div>
    </div>

    <!-- user弹窗 -->
    <div class="userDialog">
        <form class="form-horizontal">
            <div class="form-group">
                <label for="user-dialog-user" class="col-sm-3 control-label">用户名</label>
                <div class="col-sm-9">
                    <input type="text" class="form-control" id="user-dialog-user" placeholder="请输入用户名">
                </div>
            </div>
            <div class="form-group">
                <label for="user-dialog-pwd" class="col-sm-3 control-label">密码</label>
                <div class="col-sm-9">
                    <input type="text" class="form-control" id="user-dialog-pwd" placeholder="请输入密码">
                </div>
            </div>
            <div class="form-group">
                <label for="user-dialog-isadmin-text" class="col-sm-3 control-label">权限</label>
                <div class="dropdown col-sm-9">
                    <button class="btn btn-default dropdown-toggle" type="button" data-toggle="dropdown"
                        aria-haspopup="true" aria-expanded="true" id="user-dialog-isadmin-text">
                        用户
                        <span class="caret"></span>
                    </button>
                    <ul class="dropdown-menu" aria-labelledby="dropdownMenu1">
                        <li><a href="#" id="user-dialog-isadmin-user" onclick="changeUserDialogIsadmin(this)">用户</a>
                        </li>
                        <li><a href="#" id="user-dialog-isadmin-manage" onclick="changeUserDialogIsadmin(this)">管理员</a>
                        </li>
                    </ul>
                </div>
            </div>
            <div class="form-group">
                <div class="col-sm-offset-3 col-sm-9">
                    <button type="button" class="btn btn-default" onclick="userDialogConfirm()">确认</button>
                    <button type="button" class="btn btn-default" onclick="userDialogReset()">重置</button>
                    <button type="button" class="btn btn-default" onclick="userDialogCancel()">取消</button>
                </div>
            </div>
        </form>
    </div>

    <!-- todo弹窗 -->
    <div class="todoDialog">
        <form class="form-horizontal">
            <div class="form-group">
                <label for="todo-dialog-id" class="col-sm-3 control-label">ID</label>
                <div class="col-sm-9">
                    <input type="text" class="form-control" id="todo-dialog-id" placeholder="系统自动分配" readonly>
                </div>
            </div>
            <div class="form-group">
                <label for="todo-dialog-user" class="col-sm-3 control-label">用户名</label>
                <div class="col-sm-9">
                    <input type="text" class="form-control" id="todo-dialog-user" placeholder="请输入用户名">
                </div>
            </div>
            <div class="form-group">
                <label for="todo-dialog-title" class="col-sm-3 control-label">标题</label>
                <div class="col-sm-9">
                    <input type="text" class="form-control" id="todo-dialog-title" placeholder="请输入标题">
                </div>
            </div>
            <div class="form-group">
                <label for="todo-dialog-content" class="col-sm-3 control-label">内容</label>
                <div class="col-sm-9">
                    <input type="text" class="form-control" id="todo-dialog-content" placeholder="请输入内容">
                </div>
            </div>
            <div class="form-group">
                <label for="todo-dialog-classify" class="col-sm-3 control-label">分类</label>
                <div class="col-sm-9">
                    <input type="text" class="form-control" id="todo-dialog-classify" placeholder="请输入分类">
                </div>
            </div>
            <div class="form-group">
                <label for="todo-dialog-tag-text" class="col-sm-3 control-label">标签</label>
                <div class="dropdown col-sm-9">
                    <button class="btn btn-default dropdown-toggle" type="button" data-toggle="dropdown"
                        aria-haspopup="true" aria-expanded="true" id="todo-dialog-tag-text">
                        不重要不紧急
                        <span class="caret"></span>
                    </button>
                    <ul class="dropdown-menu" aria-labelledby="dropdownMenu1">
                        <li><a href="#" id="todo-dialog-tag-red" onclick="changeDialogTodoTag(this)">重要且紧急</a>
                        </li>
                        <li><a href="#" id="todo-dialog-tag-yellow" onclick="changeDialogTodoTag(this)">重要不紧急</a>
                        </li>
                        <li><a href="#" id="todo-dialog-tag-blue" onclick="changeDialogTodoTag(this)">不重要但紧急</a>
                        </li>
                        <li><a href="#" id="todo-dialog-tag-default" onclick="changeDialogTodoTag(this)">不重要不紧急</a>
                        </li>
                    </ul>
                </div>
            </div>
            <div class="form-group">
                <label for="todo-dialog-istop-text" class="col-sm-3 control-label">是否特殊</label>
                <div class="dropdown col-sm-9">
                    <button class="btn btn-default dropdown-toggle" type="button" data-toggle="dropdown"
                        aria-haspopup="true" aria-expanded="true" id="todo-dialog-istop-text">
                        否
                        <span class="caret"></span>
                    </button>
                    <ul class="dropdown-menu" aria-labelledby="dropdownMenu1">
                        <li><a href="#" id="todo-dialog-istop-yes" onclick="changeDialogTodoIstop(this)">是</a>
                        </li>
                        <li><a href="#" id="todo-dialog-istop-no" onclick="changeDialogTodoIstop(this)">否</a>
                        </li>
                    </ul>
                </div>
            </div>
            <div class="form-group">
                <label for="todo-dialog-iscircle-text" class="col-sm-3 control-label">Todo循环</label>
                <div class="dropdown col-sm-9">
                    <button class="btn btn-default dropdown-toggle" type="button" data-toggle="dropdown"
                        aria-haspopup="true" aria-expanded="true" id="todo-dialog-iscircle-text">
                        支线任务
                        <span class="caret"></span>
                    </button>
                    <ul class="dropdown-menu" aria-labelledby="dropdownMenu1">
                        <li><a href="#" id="todo-dialog-iscircle-day" onclick="changeDialogTodoIscircle(this)">日常任务</a>
                        </li>
                        <li><a href="#" id="todo-dialog-iscircle-week" onclick="changeDialogTodoIscircle(this)">周常任务</a>
                        </li>
                        <li><a href="#" id="todo-dialog-iscircle-default" onclick="changeDialogTodoIscircle(this)">支线任务</a>
                        </li>
                    </ul>
                </div>
            </div>
            <div class="form-group">
                <label for="todo-dialog-iscomplete-text" class="col-sm-3 control-label">是否完成</label>
                <div class="dropdown col-sm-9">
                    <button class="btn btn-default dropdown-toggle" type="button" data-toggle="dropdown" aria-haspopup="true"
                        aria-expanded="true" id="todo-dialog-iscomplete-text">
                        否
                        <span class="caret"></span>
                    </button>
                    <ul class="dropdown-menu" aria-labelledby="dropdownMenu1">
                        <li><a href="#" id="todo-dialog-iscomplete-yes" onclick="changeDialogTodoIscomplete(this)">是</a>
                        </li>
                        <li><a href="#" id="todo-dialog-iscomplete-no" onclick="changeDialogTodoIscomplete(this)">否</a>
                        </li>
                    </ul>
                </div>
            </div>
            <div class="form-group">
                <div class="col-sm-offset-3 col-sm-9">
                    <button type="button" class="btn btn-default" onclick="todoDialogConfirm()">确认</button>
                    <button type="button" class="btn btn-default" onclick="todoDialogReset()">重置</button>
                    <button type="button" class="btn btn-default" onclick="todoDialogCancel()">取消</button>
                </div>
            </div>
        </form>
    </div>

    <script src="./lib/jquery-3.6.1.min.js"></script>
    <script src="./lib/bootstrap/js/bootstrap.min.js"></script>
    <script src="./lib/layui/layui.js"></script>
    <script>
        //JS 
        layui.use(['element', 'layer', 'util'], function () {
            var element = layui.element;
            var layer = layui.layer;
            var util = layui.util;
            var $ = layui.$;

            //头部事件
            util.event('lay-header-event', {
                menuLeft: function (othis) { // 左侧菜单事件
                    layer.msg('展开左侧菜单的操作', { icon: 0 });
                },
            });
        });
    </script>
    
    <script src="./js/manage/manage.js"></script>
    <script src="./lib/sweetalert2/sweetalert2.all.min.js"></script>
    <script src="./js/manage/user.js"></script>
    <script src="./js/manage/todo.js"></script>
</body>

</html>
