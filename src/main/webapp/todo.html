    <div class="left-panel col-md-4">
        <div class="left-header">
            <div id="return-button" onclick="linkToIndex()"><div></div></div>
            <div id="home-button" onclick="linkToIndex()"></div>
        </div>

    <div class="right-panel col-md-8">
        <div class="right-header">
            <!-- 小提示 -->
            <div class="tip" onclick="dialogTip()"><img src="./image/todo/信息提示_1750814818.png" alt=""></div>
            <!-- 日常任务 -->
            <div class="tab tab-active" onclick="tabActive(this,'day')">
                <span>日常任务</span>
            </div>
            <!-- 周常任务 -->
            <div class="tab" onclick="tabActive(this,'week')">
                <span>周常任务</span>
            </div>
            <!-- 支线任务 -->
            <div class="tab" onclick="tabActive(this,'default')">
                <span>其他任务</span>
            </div>
        </div>
        <div class="right-main" id="todo-list">
