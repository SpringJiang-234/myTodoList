<!DOCTYPE html>
<html lang="en">

<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>TodoList</title>
    <link rel="stylesheet" href="./lib/bootstrap/css/bootstrap.min.css">
    <link rel="stylesheet" href="./css/todo.css">
</head>

<body class="row">
    <div class="left-panel col-md-4">
        <div class="left-header">
            <div id="return-button" onclick="linkToIndex()">
                <div></div>
            </div>
            <div id="home-button" onclick="todoDialogArise(1,null)">
                <span class="glyphicon glyphicon-plus" aria-hidden="true"></span>
                <span>添加</span>
                <!-- <div>
                    <span class="glyphicon glyphicon-pencil" aria-hidden="true"></span>
                    <span>修改</span>
                </div>
                <div>
                    <span class="glyphicon glyphicon-remove" aria-hidden="true"></span>
                    <span>删除</span>
                </div> -->
            </div>
        </div>
        <div class="left-main reward">
            <div class="reward-item"></div>

        </div>
    </div>
    <div class="right-panel col-md-8">
        <div class="right-header">
            <!-- 小提示 -->
            <div class="tip" onclick="dialogTip()"><img src="./image/todo/信息提示_1750814818.png" alt=""></div>
            <!-- 支线任务 -->
            <div class="tab tab-active" onclick="tabActive(this,'default')">
                <span>支线任务</span>
            </div>
            <!-- 日常任务 -->
            <div class="tab" onclick="tabActive(this,'day')">
                <span>日常任务</span>
            </div>
            <!-- 周常任务 -->
            <div class="tab" onclick="tabActive(this,'week')">
                <span>周常任务</span>
            </div>
        </div>
        <div class="right-main" id="todo-list">
            <!-- 任务存放处，需要请求然后循环放置标题，点击即可弹出弹框写明具体细节（内容等） -->
            <!-- <div class="todo-item">
                <div class="todo-item-complete-button">
                    <img src="./image/todo/国际象棋车_1750826775.png" alt="">
                    <span class="span0">0</span><span class="span1">/1</span>
                    <div></div>
                </div>
                <div class="icon-delete">
                    <span class="glyphicon glyphicon-remove" aria-hidden="true"></span>
                    <span>删除</span>
                </div>
                <div class="icon-redify">
                    <span class="glyphicon glyphicon-pencil" aria-hidden="true"></span>
                    <span>修改</span>
                </div>
                <span class="todo-item-title">搓客户端页面</span>
                <span class="todo-item-en">Title：</span>
            </div> -->
        </div>
    </div>
    <div class="footer"></div>

    <!-- 直接复制manage的弹窗 -->
    <!-- todo弹窗 -->
    <div class="todoDialog">
        <form class="form-horizontal">
            <div class="form-group hide">
                <label for="todo-dialog-id" class="col-sm-3 control-label">ID</label>
                <div class="col-sm-9">
                    <input type="text" class="form-control" id="todo-dialog-id" placeholder="系统自动分配" readonly>
                </div>
            </div>
            <div class="form-group hide">
                <label for="todo-dialog-user" class="col-sm-3 control-label">用户名</label>
                <div class="col-sm-9">
                    <input type="text" class="form-control" id="todo-dialog-user" placeholder="请输入用户名">
                </div>
            </div>
            <div class="form-group">
                <label for="todo-dialog-title" class="col-sm-3 control-label">标题</label>
                <div class="col-sm-9">
                    <input type="text" class="form-control" id="todo-dialog-title" placeholder="请输入标题">
                </div>
            </div>
            <div class="form-group">
                <label for="todo-dialog-content" class="col-sm-3 control-label">内容</label>
                <div class="col-sm-9">
                    <input type="text" class="form-control" id="todo-dialog-content" placeholder="请输入内容">
                </div>
            </div>
            <div class="form-group">
                <label for="todo-dialog-classify" class="col-sm-3 control-label">分类</label>
                <div class="col-sm-9">
                    <input type="text" class="form-control" id="todo-dialog-classify" placeholder="请输入分类">
                </div>
            </div>
            <div class="form-group">
                <label for="todo-dialog-tag-text" class="col-sm-3 control-label">标签</label>
                <div class="dropdown col-sm-9">
                    <button class="btn btn-default dropdown-toggle" type="button" data-toggle="dropdown"
                        aria-haspopup="true" aria-expanded="true" id="todo-dialog-tag-text">
                        不重要不紧急
                        <span class="caret"></span>
                    </button>
                    <ul class="dropdown-menu" aria-labelledby="dropdownMenu1">
                        <li><a href="#" id="todo-dialog-tag-red" onclick="changeDialogTodoTag(this)">重要且紧急</a>
                        </li>
                        <li><a href="#" id="todo-dialog-tag-yellow" onclick="changeDialogTodoTag(this)">重要不紧急</a>
                        </li>
                        <li><a href="#" id="todo-dialog-tag-blue" onclick="changeDialogTodoTag(this)">不重要但紧急</a>
                        </li>
                        <li><a href="#" id="todo-dialog-tag-default" onclick="changeDialogTodoTag(this)">不重要不紧急</a>
                        </li>
                    </ul>
                </div>
            </div>
            <div class="form-group">
                <label for="todo-dialog-istop-text" class="col-sm-3 control-label">是否置顶</label>
                <div class="dropdown col-sm-9">
                    <button class="btn btn-default dropdown-toggle" type="button" data-toggle="dropdown"
                        aria-haspopup="true" aria-expanded="true" id="todo-dialog-istop-text">
                        否
                        <span class="caret"></span>
                    </button>
                    <ul class="dropdown-menu" aria-labelledby="dropdownMenu1">
                        <li><a href="#" id="todo-dialog-istop-yes" onclick="changeDialogTodoIstop(this)">是</a>
                        </li>
                        <li><a href="#" id="todo-dialog-istop-no" onclick="changeDialogTodoIstop(this)">否</a>
                        </li>
                    </ul>
                </div>
            </div>
            <div class="form-group">
                <label for="todo-dialog-iscircle-text" class="col-sm-3 control-label">Todo循环</label>
                <div class="dropdown col-sm-9">
                    <button class="btn btn-default dropdown-toggle" type="button" data-toggle="dropdown"
                        aria-haspopup="true" aria-expanded="true" id="todo-dialog-iscircle-text">
                        支线任务
                        <span class="caret"></span>
                    </button>
                    <ul class="dropdown-menu" aria-labelledby="dropdownMenu1">
                        <li><a href="#" id="todo-dialog-iscircle-day" onclick="changeDialogTodoIscircle(this)">日常任务</a>
                        </li>
                        <li><a href="#" id="todo-dialog-iscircle-week" onclick="changeDialogTodoIscircle(this)">周常任务</a>
                        </li>
                        <li><a href="#" id="todo-dialog-iscircle-default"
                                onclick="changeDialogTodoIscircle(this)">支线任务</a>
                        </li>
                    </ul>
                </div>
            </div>
            <div class="form-group hide">
                <label for="todo-dialog-iscomplete-text" class="col-sm-3 control-label">是否完成</label>
                <div class="dropdown col-sm-9">
                    <button class="btn btn-default dropdown-toggle" type="button" data-toggle="dropdown"
                        aria-haspopup="true" aria-expanded="true" id="todo-dialog-iscomplete-text">
                        否
                        <span class="caret"></span>
                    </button>
                    <ul class="dropdown-menu" aria-labelledby="dropdownMenu1">
                        <li><a href="#" id="todo-dialog-iscomplete-yes" onclick="changeDialogTodoIscomplete(this)">是</a>
                        </li>
                        <li><a href="#" id="todo-dialog-iscomplete-no" onclick="changeDialogTodoIscomplete(this)">否</a>
                        </li>
                    </ul>
                </div>
            </div>
            <div class="form-group">
                <div class="col-sm-offset-3 col-sm-9">
                    <button type="button" class="btn btn-default btn-confirm" onclick="todoDialogConfirm()">确认</button>
                    <button type="button" class="btn btn-default btn-reset" onclick="todoDialogReset()">重置</button>
                    <button type="button" class="btn btn-default btn-cancel" onclick="todoDialogCancel()">取消</button>
                </div>
            </div>
        </form>
    </div>

    <script src="./lib/jquery-3.6.1.min.js"></script>
    <script src="./lib/bootstrap/js/bootstrap.min.js"></script>
    <script src="./js/todo.js"></script>
</body>

</html>
